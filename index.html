<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sniper Arena</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── START SCREEN ─────────────────────────────────────── -->
<div id="start-screen">
  <div class="ss-box">
    <h1>SNIPER ARENA</h1>
    <p class="subtitle">헤드 300 / 몸 150 / 다리 100</p>

    <div class="weapon-select">
      <button class="weapon-choice selected" data-weapon="marshal">
        <span class="wc-name">Kar98k</span>
        <span class="wc-stat">빠른 조준</span>
      </button>
      <button class="weapon-choice" data-weapon="operator">
        <span class="wc-name">AWP</span>
        <span class="wc-stat">최대 위력</span>
      </button>
    </div>

    <div class="controls-grid">
      <div class="ctrl-row"><kbd>W A S D</kbd> 이동</div>
      <div class="ctrl-row"><kbd>우클릭</kbd> 스코프</div>
      <div class="ctrl-row"><kbd>좌클릭</kbd> 사격</div>
      <div class="ctrl-row"><kbd>R</kbd> 재장전</div>
      <div class="ctrl-row"><kbd>L-Shift</kbd> 걷기</div>
      <div class="ctrl-row"><kbd>L-Ctrl</kbd> 슬라이딩</div>
      <div class="ctrl-row"><kbd>Space</kbd> 점프</div>
      <div class="ctrl-row"><kbd>1 / 2</kbd> 무기 전환</div>
    </div>

    <div class="sens-row">
      <label>마우스 감도</label>
      <input type="range" id="sens-slider" min="0.2" max="5" step="0.1" value="1">
      <span id="sens-val">1.0</span>
    </div>

    <button id="start-btn">▶ 게임 시작</button>
  </div>
</div>

<!-- ── GAME CANVAS ───────────────────────────────────────── -->
<div id="game-canvas"></div>

<!-- ── SCOPE OVERLAY ─────────────────────────────────────── -->
<div id="scope-overlay"></div>

<!-- ── DAMAGE FLASH ──────────────────────────────────────── -->
<div id="damage-flash"></div>

<!-- ── DEATH OVERLAY ─────────────────────────────────────── -->
<div id="death-overlay">
  <div id="death-msg">ELIMINATED</div>
  <div id="death-killer"></div>
  <div id="death-countdown"></div>
</div>

<!-- ── HUD ──────────────────────────────────────────────── -->
<div id="hud">

  <!-- Top: K/D -->
  <div id="hud-top">
    <div class="kd-display">
      <div class="kd-block"><span class="kd-lbl">KILLS</span><span class="kd-val" id="kills">0</span></div>
      <div class="kd-sep">/</div>
      <div class="kd-block"><span class="kd-lbl">DEATHS</span><span class="kd-val" id="deaths">0</span></div>
    </div>
  </div>

  <!-- Bottom left: health -->
  <div id="hud-bl">
    <div class="stat-pill">
      <span class="ico">❤️</span>
      <span class="val" id="health">100</span>
    </div>
  </div>

  <!-- Bottom right: weapon + ammo -->
  <div id="hud-br">
    <div id="weapon-slots">
      <div class="wslot active" id="slot-primary"><span class="sname">Kar98k</span><span class="sammo">5</span></div>
    </div>
    <div id="ammo-box">
      <span id="weapon-name">Kar98k</span>
      <div id="ammo-row">
        <span id="ammo-current">5</span>
        <span id="ammo-sep">/</span>
        <span id="ammo-reserve">20</span>
      </div>
    </div>
  </div>

  <!-- Crosshair -->
  <div id="crosshair">
    <div class="ch ch-t"></div>
    <div class="ch ch-b"></div>
    <div class="ch ch-l"></div>
    <div class="ch ch-r"></div>
    <div class="ch ch-dot"></div>
  </div>

  <!-- Hit marker -->
  <div id="hit-marker"></div>

  <!-- Reload bar -->
  <div id="reload-bar">
    <div id="reload-lbl">RELOADING</div>
    <div id="reload-track"><div id="reload-fill"></div></div>
  </div>

  <!-- Kill feed -->
  <div id="kill-feed"></div>

  <!-- Damage numbers -->
  <div id="damage-numbers"></div>

  <!-- Message toast -->
  <div id="message"></div>

</div>

<!-- ── Scripts ───────────────────────────────────────────── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/weapons.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script>
  window.addEventListener('load', () => { window.game = new FPSGame(); });
</script>
</body>
</html>
